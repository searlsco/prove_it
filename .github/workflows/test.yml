name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Git 2.54+
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git
          git --version

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Show tool versions
        run: |
          node --version
          npm --version
          git --version

      - name: Run tests
        run: ./script/test
